name: Update BIST market data

on:
  workflow_dispatch:
  schedule:
    # BIST seansı boyunca 10 dakikada bir. GitHub cron UTC kullanır.
    - cron: "*/10 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-market-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data package
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check curl_cffi

      - name: Prepare data files
        run: |
          mkdir -p data
          test -f data/intraday.json || echo '{"updatedAt":"1970-01-01T00:00:00Z","symbols":{}}' > data/intraday.json
          test -f data/daily.json || echo '{"updatedAt":"1970-01-01T00:00:00Z","symbols":{}}' > data/daily.json

      - name: Fetch BIST100 data fast
        run: |
          python fetch_market.py --mode both

      - name: Commit updated data
        run: |
          git config user.name "bist-robot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/intraday.json data/daily.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Fast update BIST100 market data"
            git pull --rebase origin main
            git push
          fi
