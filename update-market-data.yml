name: Update BIST market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-intraday-data
  cancel-in-progress: true

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install market packages
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check yfinance pandas curl_cffi

      - name: Prepare intraday file
        run: |
          mkdir -p data
          test -f data/intraday.json || echo '{"updatedAt":null,"symbols":{}}' > data/intraday.json

      - name: Fetch 15-minute BIST100 data
        run: python fetch_market.py --mode intraday

      - name: Commit intraday data
        run: |
          git config user.name "bist-robot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/intraday.json
          if git diff --cached --quiet; then
            echo "No intraday change."
          else
            git commit -m "Update BIST100 intraday data"
            git pull --rebase origin main
            git push
          fi
