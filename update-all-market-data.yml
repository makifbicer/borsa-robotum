name: Update BIST TUM market data

on:
  workflow_dispatch:
  schedule:
    # Broad universe is heavier than BIST100. Update hourly during market hours.
    - cron: "5 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-all-market-data
  cancel-in-progress: true

jobs:
  update-all-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source packages
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check curl_cffi pykap

      - name: Prepare broad-universe files
        run: |
          mkdir -p data
          test -f data/all_intraday.json || echo '{"updatedAt":"1970-01-01T00:00:00Z","symbols":{}}' > data/all_intraday.json
          test -f data/all_daily.json || echo '{"updatedAt":"1970-01-01T00:00:00Z","symbols":{}}' > data/all_daily.json
          test -f data/symbols.json || echo '{"updatedAt":null,"symbols":["PKGYO"],"names":{}}' > data/symbols.json

      - name: Fetch BIST TUM data
        run: python fetch_all_market.py

      - name: Commit BIST TUM data
        run: |
          git config user.name "bist-robot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/all_intraday.json data/all_daily.json data/symbols.json
          if git diff --cached --quiet; then
            echo "No broad-universe data change."
          else
            git commit -m "Update BIST TUM market data"
            git pull --rebase origin main
            git push
          fi
